[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hmc-portfolio"
version = "0.1.0"
description = "Portfolio analysis tool"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pandas>=2.1.3",
    "numpy>=1.25.2",
    "scipy>=1.11.4",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "yfinance>=0.2.28",
    "sqlalchemy>=2.0.23",
    "asyncpg>=0.29.0",
    "httpx>=0.25.2",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.10.1",
    "alembic>=1.16.5",
    "redis>=6.4.0",
    "aioredis>=2.0.1",
    "python-jose>=3.5.0",
    "passlib>=1.7.4",
    "python-multipart>=0.0.20",
    "pydantic>=2.11.7",
    "click>=8.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.7.0",
    "jupyter>=1.0.0",
]

# Don't build as package, just manage dependencies
[tool.setuptools]
py-modules = []

[tool.uv.workspace]
members = [
    "backend",
]
