name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        version: "latest"
    
    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}
      
    - name: Install dependencies
      run: |
        uv sync --extra dev
        
    - name: Lint with flake8
      run: |
        uv run flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
        uv run flake8 src tests --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics
        
    - name: Format check with black
      run: |
        uv run black --check src tests
        
    - name: Type check with mypy
      run: |
        uv run mypy src
        
    - name: Test with pytest
      run: |
        uv run pytest tests/ -v --cov=src --cov-report=xml
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: true

  integration-test:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v2
      
    - name: Set up Python 3.11
      run: uv python install 3.11
      
    - name: Install dependencies
      run: |
        uv sync --extra dev
        
    - name: Run integration test
      run: |
        uv run python examples/example_analysis.py
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: analysis-plots
        path: "*.png"